let ac = null;
function ctx(){
  if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if(ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f0, f1, dur, type, vol){
  const c = ctx(), t = c.currentTime;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, cutoff){
  const c = ctx(), t = c.currentTime, len = Math.floor(c.sampleRate * dur);
  const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for(let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(); s.buffer = b;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
  const g = c.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(c.destination);
  s.start(t);
}

const SND = {};
function loadSnd(name, url){
  if(SND[name]) return;
  fetch(url).then(r => r.arrayBuffer()).then(b => ctx().decodeAudioData(b)).then(buf => { SND[name] = buf; }).catch(() => {});
}
function playSnd(name, url, vol){
  const buf = SND[name];

    const c = ctx(), s = c.createBufferSource(), g = c.createGain();
    s.buffer = buf; g.gain.value = vol || 1;
    s.connect(g).connect(c.destination); s.start();
  } else {
    const a = new Audio(url); a.volume = Math.min(1, vol || 1); a.play().catch(() => {});
  }
}

/* ===== BACKGROUNDS ===== */
function visible(cv){ return cv.closest('.screen').classList.contains('on'); }
function fit(cv){
  const d = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.round(cv.offsetWidth * d); cv.height = Math.round(cv.offsetHeight * d);
  const g = cv.getContext('2d'); g.setTransform(d, 0, 0, d, 0, 0);
  return { g, W: cv.offsetWidth, H: cv.offsetHeight };
}
function ballsBG(cv){
  let s, B = [];
  const cols = ['201,167,255','158,240,176','167,216,255','255,214,167'];
  function rs(){ s = fit(cv); B = Array.from({length:12}, (_, i) => ({ x:Math.random()*s.W, y:Math.random()*s.H, r:24+Math.random()*44, vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, c:cols[i%4] })); }
  rs(); addEventListener('resize', rs);
  (function loop(){
    if(visible(cv)){
      const { g, W, H } = s; g.clearRect(0,0,W,H);
      for(const b of B){
        b.vy += 0.05; b.x += b.vx; b.y += b.vy;
        if(b.x < b.r){ b.x = b.r; b.vx *= -0.9; }
        if(b.x > W-b.r){ b.x = W-b.r; b.vx *= -0.9; }
        if(b.y > H-b.r){ b.y = H-b.r; b.vy *= -0.85; }
        if(b.y < b.r){ b.y = b.r; b.vy *= -0.9; }
        const gr = g.createRadialGradient(b.x, b.y, b.r*0.2, b.x, b.y, b.r);
        gr.addColorStop(0, `rgba(${b.c},.75)`); gr.addColorStop(1, `rgba(${b.c},0)`);
        g.fillStyle = gr; g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI*2); g.fill();
      }
    }
    requestAnimationFrame(loop);
  })();
}
function snowBG(cv){
  let s, F = [], S = [];
  function rs(){
    s = fit(cv);
    F = Array.from({length:70}, () => ({ x:Math.random()*s.W, y:Math.random()*s.H, r:1+Math.random()*2.5, vy:0.5+Math.random()*1.4, ph:Math.random()*6 }));
    S = Array.from({length:8}, () => ({ x:Math.random()*s.W, y:Math.random()*s.H, l:80+Math.random()*140, v:6+Math.random()*9 }));
  }
  rs(); addEventListener('resize', rs);
  (function loop(t){
    if(visible(cv)){
      const { g, W, H } = s; g.clearRect(0,0,W,H);
      g.strokeStyle = 'rgba(255,255,255,.18)'; g.lineWidth = 2;
      g.beginPath();
      for(const w of S){
        w.x += w.v; if(w.x > W + w.l){ w.x = -w.l; w.y = Math.random()*H; }
        g.moveTo(w.x, w.y); g.lineTo(w.x - w.l, w.y + w.l*0.1);
      }
      g.stroke();
      g.fillStyle = '#fff'; g.beginPath();
      for(const f of F){
        f.y += f.vy; f.x += Math.sin(t/800 + f.ph)*0.6 + 0.3;
        if(f.y > H){ f.y = -5; f.x = Math.random()*W; }
        g.moveTo(f.x + f.r, f.y); g.arc(f.x, f.y, f.r, 0, Math.PI*2);
      }
      g.fill();
    }
    requestAnimationFrame(loop);
  })(0);
}
function bricksBG(cv){
  function draw(){
    const { g, W, H } = fit(cv);
    const bw = 70, bh = 28;
    g.fillStyle = '#6e6e6e'; g.fillRect(0,0,W,H);
    for(let y = 0, row = 0; y < H; y += bh, row++){
      for(let x = -(row%2)*bw/2; x < W; x += bw){
        const s = Math.floor(90 + Math.random()*40);
        g.fillStyle = `rgb(${s},${s},${s})`; g.fillRect(x+2, y+2, bw-4, bh-4);
      }
    }
    for(let i = 0; i < 900; i++){
      g.fillStyle = `rgba(0,0,0,${Math.random()*0.35})`;
      g.fillRect(Math.random()*W, Math.random()*H, 2, 2);
    }
  }
  draw(); addEventListener('resize', draw);
}

/* ===== FX HELPERS ===== */
function center(el){ const r = el.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2, top:r.top }; }
function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function bez(a, b, arc, t){
  const mx = (a.x+b.x)/2, my = Math.min(a.y, b.y) - arc;
  return { x:(1-t)*(1-t)*a.x + 2*(1-t)*t*mx + t*t*b.x, y:(1-t)*(1-t)*a.y + 2*(1-t)*t*my + t*t*b.y };
}
function particle(cls, x, y, dx = 0, dy = 0, dur = 500, size = null){
  const d = document.createElement('div'); d.className = cls;
  if(size){ d.style.width = d.style.height = size + 'px'; d.style.margin = (-size/2) + 'px 0 0 ' + (-size/2) + 'px'; }
  d.style.left = x + 'px'; d.style.top = y + 'px';
  document.body.appendChild(d);
  d.animate([
    { transform:'translate(0,0) scale(1)', opacity:0.95 },
    { transform:`translate(${dx}px,${dy}px) scale(.3)`, opacity:0 }
  ], { duration:dur, easing:'cubic-bezier(.2,.7,.4,1)', fill:'forwards' });
  setTimeout(() => d.remove(), dur + 60);
}
function arcFly(cls, a, b, dur, arc, trailCls, onDone){
  const el = document.createElement('div'); el.className = cls;
  document.body.appendChild(el);
  const kf = [];
  for(let i = 0; i <= 12; i++){
    const t = i/12, p = bez(a, b, arc, t), q = bez(a, b, arc, Math.min(1, t+0.02));
    const ang = Math.atan2(q.y-p.y, q.x-p.x) * 180 / Math.PI;
    kf.push({ transform:`translate(${p.x}px,${p.y}px) rotate(${ang}deg)`, offset:t });
  }
  el.animate(kf, { duration:dur, easing:'linear', fill:'forwards' }).onfinish = () => { el.remove(); if(onDone) onDone(); };
  if(trailCls){
    const t0 = performance.now();
    const iv = setInterval(() => {
      const t = Math.min(1, (performance.now() - t0) / dur), p = bez(a, b, arc, t);
      particle(trailCls, p.x, p.y, rnd(-10,10), rnd(-10,10), 420);
      if(t >= 1) clearInterval(iv);
    }, 40);
  }
}

function damagePlayer(dmg, color){

function stunned(){ return !!(E && E.stunUntil && Date.now() < E.stunUntil); }

/* ===== ENEMY AI ===== */
function scheduleEnemy(delay){
  E.due = Date.now() + delay;
  clearTimeout(enemyTimeout);
  enemyTimeout = setTimeout(enemyAttack, delay);
}
/* HeadButt: 600 мс замаха, за это время можно нажать Block */
function enemyAttack(){
  if(over || !E.d.head || E.d.glitch) return;
  if(stunned()){ scheduleEnemy(E.stunUntil - Date.now() + 50); return; }
  if(E.pauseUntil && Date.now() < E.pauseUntil){ scheduleEnemy(E.pauseUntil - Date.now() + 50); return; }
  const dmg = rnd(E.d.head[0], E.d.head[1]);
  const pend = { cancelled:false, landed:false };
  E.pending = pend;
  restart($('#fE'), 'jit');
  scheduleEnemy(E.boosting ? (E.d.boostHead || 3000) : E.d.headCd);
  setTimeout(() => {
    pend.landed = true;
    if(over || pend.cancelled) return;
    sfx.hit();
    if(E.d.head[0] >= 100) dustBig(center($('#fP')), 8);
    damagePlayer(dmg);
  }, 600);
}
function slowEnemy(ms){
  if(over) return;
  E.due += ms; clearTimeout(enemyTimeout);
  enemyTimeout = setTimeout(enemyAttack, Math.max(0, E.due - Date.now()));
}

function makeBeam(x1, y1, x2, y2){
  const d = document.createElement('div'); d.className = 'beam';
  const len = Math.hypot(x2-x1, y2-y1), ang = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
  d.style.left = x1 + 'px'; d.style.top = y1 + 'px'; d.style.width = len + 'px';
  d.style.transform = `rotate(${ang}deg)`;
  document.body.appendChild(d);
  return d;
}

/* ===== ABILITY OFFERS ===== */
/* Кнопка Destruction заперта, пока не сделано 3 атаки */
function updateLock(){
  if(!P) return;
  const b = $('#abil').querySelector('[data-ab="Destruction"]');
  if(!b) return;
  const lk = P.atk < 3;
  b.classList.toggle('locked', lk);
  b.textContent = lk ? ('Destruction\n' + P.atk + '/3') : 'Destruction';
}
function offerAbilities(){
  if(over || abilOpen || (P.noAttackUntil && Date.now() < P.noAttackUntil)) return;
  abilOpen = true;
  updateLock();
  $('#abil').classList.add('on'); $('#ring').classList.add('on');
}
function hideAbilities(){
  abilOpen = false;
  $('#abil').classList.remove('on'); $('#ring').classList.remove('on');
}
function scheduleOffer(){
  clearTimeout(offerTimer);
  const boosted = P && P.boostUntil > Date.now();
  const cd = boosted ? (P.boostCd || 4000) : P.d.cd;
  offerTimer = setTimeout(() => { offerAbilities(); scheduleOffer(); }, cd);
}
function useAbility(name){
  if(!abilOpen || over) return;
  if(name === 'Destruction' && P.atk < 3){
    floatText($('#fP'), 'Нужно 3 атаки: ' + P.atk + '/3', '#c4b5fd');
    return;
  }
  hideAbilities();
  if(P.d.abl.indexOf('Destruction') >= 0){
    if(name === 'Destruction') P.atk = 0; else P.atk++;
  }
  switch(name){
    case 'Punch': return punch();
    case 'Kick': return kick();
    case 'Rock': return rock();
    case 'Block': return block();
    case 'Crush': return crush();
    case 'SoundWave V2': return soundWaveV2();
    case 'RocksV2': return rocksV2();
    case 'BlindScreen': return blindScreen();
    case 'Cosmic Block': return cosmicBlock();
    case 'SoundWave': return soundWave();
    case 'SpeedBoost': return speedBoost();
    case 'PurpleScreen': return purpleScreen();
    case 'Slash': return slash();
    case 'SoundWave V3': return soundWaveV3();
    case 'Slash V2': return slashV2();
    case 'SpeedBoost V2': return speedBoostV2();
    case 'Execution': return executionV2();
    case 'Slash V3': return slashV3();
    case 'EnergizedScreen': return energizedScreen();
    case 'Submerge': return submerge();
    case 'Destruction': return destruction();
  }
}

function ray(x1, y1, x2, y2, dur, cls){

  const len = Math.hypot(x2-x1, y2-y1), ang = Math.atan2(y2-y1, x2-x1) * 180 / Math.PI;
  d.style.left = x1 + 'px'; d.style.top = y1 + 'px'; d.style.width = len + 'px';
  d.style.transform = `rotate(${ang}deg)`;
  document.body.appendChild(d);
  d.animate([{ opacity:0 }, { opacity:1, offset:0.3 }, { opacity:0 }], { duration:dur, fill:'forwards' });
  setTimeout(() => d.remove(), dur + 40);
}

/* Submerge — телепорт, живой чёрный дым вокруг (−10 урона от каждой атаки врага), пила с неба */
function sawPoly(a0, a1, half){
  const pts = [], step = 7.5;
  if(half) pts.push('50% 50%');
  for(let a = a0; a <= a1; a += step){
    const odd = Math.round((a - a0) / step) % 2, r = odd ? 38 : 50, rad = a * Math.PI / 180;
    pts.push((50 + r * Math.cos(rad)).toFixed(1) + '% ' + (50 + r * Math.sin(rad)).toFixed(1) + '%');
  }
  if(half) pts.push('50% 50%');
  return 'polygon(' + pts.join(',') + ')';
}
function makeSaw(a0, a1, half){
  const s = document.createElement('div'); s.className = 'saw';
  s.style.clipPath = sawPoly(a0, a1, half);
  document.body.appendChild(s);
  return s;
}

function makeZBeam(x1, y1, x2, y2){

}

/* ===== Мгновенный звук: файлы заранее загружены в память, без задержки при нажатии ===== */
const _preSnd = {};
function preSnd(url){
  if(_preSnd[url]) return;
  const a = new Audio(url);
  a.preload = 'auto';
  a.load();
  _preSnd[url] = a;
}
preSnd(BV2_URL);
preSnd(SAW_SND);
preSnd(LP_SND);

playSnd = function(name, url, vol){
  const buf = SND[name];
  if(buf){
    const c = ctx(), s = c.createBufferSource(), g = c.createGain();
    s.buffer = buf; g.gain.value = vol || 1;
    s.connect(g).connect(c.destination); s.start();
    return;
  }
  preSnd(url);
  const base = _preSnd[url];
  let a = base;
  if(!base.paused && base.currentTime > 0) a = base.cloneNode();
  a.volume = Math.min(1, vol || 1);
  try{ a.currentTime = 0; }catch(e){}
  a.play().catch(() => {});
};

/* ===== G-Hare 1.0: Lasers V2 (улучшенные) ===== */
ghLasers = function(){
  if(over) return;
  const fe = $('#fE'), fp = $('#fP');
  scheduleEnemy(E.d.headCd);
  playSnd('ghLaser', GH_LASER, 1.5);
  fe.classList.add('tremble');
  const chIv = setInterval(() => {
    if(over){ clearInterval(chIv); fe.classList.remove('tremble'); return; }
    const c = center(fe);
    for(let i = 0; i < 2; i++){
      const a = Math.random() * Math.PI * 2, r = rnd(110, 190);
      particle('bzSpark', c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, -Math.cos(a) * r * 0.8, -Math.sin(a) * r * 0.8, 520);
    }
    particle('spark', c.x + rnd(-120,120), c.y + rnd(-150,100), rnd(-70,70), rnd(-90,30), 420);
    if(Math.random() < 0.4) particle('flash', c.x + rnd(-80,80), c.y + rnd(-100,80), 0, 0, 260, rnd(60,120));
  }, 90);
  setTimeout(() => {
    clearInterval(chIv);
    if(over){ fe.classList.remove('tremble'); return; }
    fe.src = E.d.lsModel;
    restart($('#arena'), 'quake');
    softShake(8000);
    const DUR = 8000, end = Date.now() + DUR;
    const offs = [-34, 34];
    const src = () => { const r = fe.getBoundingClientRect(); return { x:r.left + r.width * 0.3, y:r.top + r.height * 0.3 }; };
    const s0 = src(), t0 = center(fp);
    const beams = offs.map(o => {
      const d = makeGhBeam();
      setBeam(d, s0.x, s0.y + o, t0.x, t0.y + o * 0.6);
      d.animate([{ clipPath:'inset(-60px 100% -60px 0)' }, { clipPath:'inset(-60px 0 -60px 0)' }], { duration:260, easing:'ease-out', fill:'forwards' });
      return d;
    });
    const flares = [document.createElement('div'), document.createElement('div')];
    flares.forEach(f => { f.className = 'ghFlare'; document.body.appendChild(f); });
    const scorch = document.createElement('div'); scorch.className = 'ghScorch'; document.body.appendChild(scorch);
    fp.classList.add('tremble');
    particle('flash', s0.x, s0.y, 0, 0, 320, 220);
    shockRing(s0, 'rgba(250,204,21,.95)');
    let done = false, tick = 0;
    function cleanup(){
      if(done) return; done = true;
      clearInterval(fxIv); clearInterval(dmgIv);
      beams.forEach(b => b.remove());
      flares.forEach(f => f.remove());
      scorch.remove();
      fp.classList.remove('tremble');
      fe.classList.remove('tremble');
      if(!over) fe.src = E.d.model;
    }
    const fxIv = setInterval(() => {
      if(over || Date.now() > end){ cleanup(); return; }
      tick++;
      const a = src(), b = center(fp);
      beams.forEach((d, i) => setBeam(d, a.x, a.y + offs[i], b.x, b.y + offs[i] * 0.6));
      flares.forEach((f, i) => { f.style.left = a.x + 'px'; f.style.top = (a.y + offs[i]) + 'px'; });
      scorch.style.left = b.x + 'px'; scorch.style.top = (b.y + 90) + 'px';
      /* у источника */
      particle('spark', a.x + rnd(-20,20), a.y + rnd(-40,40), rnd(-70,40), rnd(-70,70), 380);
      particle('bzSpark', a.x + rnd(-20,20), a.y + rnd(-40,40), rnd(-90,60), rnd(-90,60), 420);
      /* на цели: огонь, дым, пыль, искры */
      particle('fire', b.x + rnd(-70,70), b.y + rnd(0,80), rnd(-30,30), -rnd(80,170), 650 + rnd(0,300), rnd(26,50));
      particle('bzFire', b.x + rnd(-60,60), b.y + rnd(10,80), rnd(-40,40), -rnd(60,140), 600 + rnd(0,300), rnd(16,30));
      particle('bzSlEmber', b.x + rnd(-50,50), b.y + rnd(-60,60), rnd(-130,130), rnd(-140,40), 500 + rnd(0,300));
      particle('bzSpark', b.x + rnd(-50,50), b.y + rnd(-60,60), rnd(-110,110), rnd(-120,40), 450 + rnd(0,250));
      particle('dsmoke', b.x + rnd(-60,60), b.y + rnd(-50,50), rnd(-50,50), -rnd(50,110), 1000 + rnd(0,400), rnd(80,110));
      particle('puff', b.x + rnd(-70,70), b.y + rnd(20,90), rnd(-90,90), -rnd(10,50), 800 + rnd(0,300), rnd(70,110));
      if(tick % 3 === 0){ shockRing(b, 'rgba(251,146,60,.9)'); particle('flash', b.x + rnd(-30,30), b.y + rnd(-40,40), 0, 0, 240, rnd(80,130)); }
      if(tick % 4 === 0){ dustBig(b, 2); restart(fp, 'shake'); }
      /* лучи искр вдоль лучей */
      const t = Math.random();
      particle('bzSpark', a.x + (b.x - a.x) * t + rnd(-15,15), a.y + (b.y - a.y) * t + rnd(-25,25), rnd(-50,50), rnd(-70,10), 400);
    }, 110);
    const dmgIv = setInterval(() => {
      if(over || Date.now() > end){ clearInterval(dmgIv); return; }
      sfx.zap();
      damagePlayer(350, '#fde047');
    }, 300);
    setTimeout(cleanup, DUR + 100);
  }, 1100);
};

function tsBulletFly(a, b, dur, dmg){
  const el = document.createElement('div'); el.className = 'tsBullet';
  document.body.appendChild(el);
  const kf = [];
  for(let i = 0; i <= 12; i++){
    const t = i / 12, p = bez(a, b, 40, t), q = bez(a, b, 40, Math.min(1, t + 0.02));
    const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
    kf.push({ transform:`translate(${p.x}px,${p.y}px) rotate(${ang}deg)`, offset:t });
  }
  const t0 = performance.now();
  let k = 0;
  const iv = setInterval(() => {
    const t = Math.min(1, (performance.now() - t0) / dur), p = bez(a, b, 40, t);
    particle('tsRedWave', p.x, p.y, rnd(-12,12), rnd(-12,12), 420, rnd(70,100));
    particle('fire', p.x, p.y, rnd(-20,20), rnd(-20,20), 480, rnd(24,40));
    if(k++ % 2 === 0) particle('dsmoke', p.x, p.y, rnd(-20,20), rnd(-30,10), 900, rnd(70,100));
    if(t >= 1) clearInterval(iv);
  }, 50);
  el.animate(kf, { duration:dur, easing:'linear', fill:'forwards' }).onfinish = () => {
    el.remove(); clearInterval(iv);
    if(over) return;
    tsExplode(center($('#fE')), dmg);
  };
}

  particle('fire', x + rnd(-10,10), y + rnd(-15,15), -rnd(40,110), rnd(-30,30), 520, rnd(30,52));

function rageDash(){
  const fp = $('#fP'), fe = $('#fE');
  P.dashReadyAt = Infinity;
  sfx.boost();
  restart(fp, 'jit');
  const c0 = center(fp);
  shockRing(c0, 'rgba(255,100,40,.9)');
  particle('flash', c0.x, c0.y, 0, 0, 280, 150);
  const chIv = setInterval(jetFx, 50);
  setTimeout(() => {
    clearInterval(chIv);
    if(over) return;
    const fr = fp.getBoundingClientRect(), er = fe.getBoundingClientRect();
    const a = center(fp), b = center(fe);
    const dx = Math.max(60, er.left + er.width * 0.12 - (fr.left + fr.width * 0.9));
    const dy = (b.y - a.y) * 0.7;
    const an = fp.animate([
      { transform:'translate(0,0) rotate(0deg)' },
      { transform:`translate(${dx}px,${dy}px) rotate(12deg)` }
    ], { duration:500, easing:'cubic-bezier(.6,0,.9,.5)', fill:'forwards' });
    P.dashAnims.push(an);
    const iv = setInterval(() => { if(over){ clearInterval(iv); return; } jetFx(); }, 45);
    an.onfinish = () => {
      clearInterval(iv);
      if(over) return;
      const c = center(fe);
      sfx.crush(); sfx.hit();
      restart($('#arena'), 'quake');
      restart(fe, 'hurt');
      particle('flash', c.x, c.y, 0, 0, 360, 240);
      shockRing(c, 'rgba(255,255,255,.95)');
      setTimeout(() => shockRing(c, 'rgba(251,146,60,.85)'), 100);
      impactFx(fe, 'spark');
      dustBig(c, 6);
      smokeAt(fe, 230);
      for(let i = 0; i < 8; i++) particle('shard', c.x + rnd(-30,30), c.y + rnd(-30,30), rnd(-140,140), rnd(-120,50), 600 + rnd(0,300));
      floatText(fe, 'STUN', '#fde047');
      damageEnemy(1000);
      const STUN = 20000, end = Date.now() + STUN;
      E.stunUntil = end;
      if(E.pending && !E.pending.landed) E.pending.cancelled = true;
      fe.classList.add('tremble');
      const sIv = setInterval(() => {
        if(over || Date.now() > end){ clearInterval(sIv); fe.classList.remove('tremble'); return; }
        const e = center(fe);
        particle('spark', e.x + rnd(-60,60), e.y + rnd(-70,60), rnd(-60,60), rnd(-80,20), 420);
        if(Math.random() < 0.4) particle('dsmoke', e.x + rnd(-50,50), e.y + rnd(-40,50), rnd(-30,30), -rnd(40,90), 1000, rnd(70,100));
      }, 350);
      setTimeout(() => {
        if(over) return;
        const an2 = fp.animate([
          { transform:`translate(${dx}px,${dy}px) rotate(12deg)` },
          { transform:'translate(0,0) rotate(0deg)' }
        ], { duration:650, easing:'ease-in-out', fill:'forwards' });
        P.dashAnims.push(an2);
        const iv2 = setInterval(() => { if(over){ clearInterval(iv2); return; } jetFx(); }, 50);
        an2.onfinish = () => {
          clearInterval(iv2);
          try{ an.cancel(); an2.cancel(); }catch(e){}
          P.dashReadyAt = Date.now() + 30000;
        };
      }, 380);
    };
  }, 380);
}

    for(let i = 0; i < 5; i++) particle('dsmoke', c.x + rnd(-60,60), c.y + rnd(-50,50), rnd(-70,70), -rnd(40,110), 1200 + rnd(0,600), rnd(90,110));
    for(let i = 0; i < 6; i++) particle(i % 2 ? 'bzSpark' : 'bzSlEmber', c.x + rnd(-30,30), c.y + rnd(-30,30), rnd(-150,150), rnd(-150,50), 550 + rnd(0,300));
    damagePlayer(dmg, '#ef4444');
  };
}
function itBarrage(){
  playSnd('tsRage', TS_RAGE, 1.5);
  const c = center($('#fE'));
  shockRing(c, 'rgba(255,23,68,.95)');
  setAura($('#eaura'), 'red');
  let n = 0;
  const fire = () => { if(over) return; n++; itBullet(600, false); };
  fire();
  const iv = setInterval(() => { if(over || n >= 4){ clearInterval(iv); return; } fire(); }, 800);
  setTimeout(() => { if(!over) setAura($('#eaura'), null); }, 3400);
}

function itJet(){
  const r = $('#fE').getBoundingClientRect();
  const x = r.left + r.width * 0.85, y = r.top + r.height * 0.55;
  particle('fire', x + rnd(-10,10), y + rnd(-15,15), rnd(40,110), rnd(-30,30), 520, rnd(30,52));
  particle('dsmoke', x + rnd(-10,10), y + rnd(-15,15), rnd(40,120), rnd(-40,20), 1000, rnd(80,110));
  particle('bzSpark', x, y, rnd(50,130), rnd(-60,60), 420);
}
function itDash(pend){
  const fe = $('#fE'), fp = $('#fP');
  E.itDashAt = Infinity;
  sfx.boost();
  restart(fe, 'jit');
  const c0 = center(fe);
  shockRing(c0, 'rgba(163,230,53,.9)');
  particle('flash', c0.x, c0.y, 0, 0, 280, 150);
  const chIv = setInterval(itJet, 50);
  setTimeout(() => {
    clearInterval(chIv);
    if(over) return;
    const fr = fe.getBoundingClientRect(), pr = fp.getBoundingClientRect();
    const a = center(fe), b = center(fp);
    const dx = Math.min(-60, pr.left + pr.width * 0.88 - (fr.left + fr.width * 0.1));
    const dy = (b.y - a.y) * 0.7;
    const an = fe.animate([
      { transform:'translate(0,0) rotate(0deg)' },
      { transform:`translate(${dx}px,${dy}px) rotate(-12deg)` }
    ], { duration:500, easing:'cubic-bezier(.6,0,.9,.5)', fill:'forwards' });
    E.itAnims.push(an);
    const iv = setInterval(() => { if(over){ clearInterval(iv); return; } itJet(); }, 45);
    an.onfinish = () => {
      clearInterval(iv);
      if(over) return;
      if(!pend.cancelled){
        pend.landed = true;
        sfx.crush(); sfx.hit();
        const c = center(fp);
        itHitFx(c, true);
        for(let i = 0; i < 6; i++) particle('shard', c.x + rnd(-30,30), c.y + rnd(-30,30), rnd(-140,140), rnd(-120,50), 600 + rnd(0,300));
        floatText(fp, 'STUN', '#fde047');
        damagePlayer(1000, '#fb923c');
        P.noAttackUntil = Date.now() + 20000;
        hideAbilities();
        fp.classList.add('tremble');
        setTimeout(() => fp.classList.remove('tremble'), 20000);
      }
      setTimeout(() => {
        if(over) return;
        const an2 = fe.animate([
          { transform:`translate(${dx}px,${dy}px) rotate(-12deg)` },
          { transform:'translate(0,0) rotate(0deg)' }
        ], { duration:650, easing:'ease-in-out', fill:'forwards' });
        E.itAnims.push(an2);
        const iv2 = setInterval(() => { if(over){ clearInterval(iv2); return; } itJet(); }, 50);
        an2.onfinish = () => {
          clearInterval(iv2);
          try{ an.cancel(); an2.cancel(); }catch(e){}
          E.itDashAt = Date.now() + 30000;
        };
      }, 380);
    };
  }, 380);
}

function itAttack(){
  if(over || !E || !E.d.it) return;
  if(stunned()){ scheduleEnemy(E.stunUntil - Date.now() + 50); return; }
  if(E.pauseUntil && Date.now() < E.pauseUntil){ scheduleEnemy(E.pauseUntil - Date.now() + 50); return; }
  scheduleEnemy(E.d.headCd);
  const pend = { cancelled:false, landed:false };
  E.pending = pend;
  const opts = ['scream', 'slap', 'shoot'];
  if(E.itBarrageOk) opts.push('barrage');
  if(Date.now() >= (E.itDashAt || 0)) opts.push('dash');
  const pick = opts[rnd(0, opts.length - 1)];
  if(pick === 'scream') itScream(pend);
  else if(pick === 'slap') itSlap(pend);
  else if(pick === 'shoot'){ E.itBarrageOk = true; itBullet(rnd(1567, 1981), true); }
  else if(pick === 'barrage'){ E.itBarrageOk = false; itBarrage(); }
  else itDash(pend);
}

const _enemyAttackIT = enemyAttack;
enemyAttack = function(){
  if(!over && E && E.d && E.d.it) return itAttack();
  return _enemyAttackIT.apply(this, arguments);
};

const _endFightIT = endFight;
endFight = function(){
  if(E && E.itAnims) E.itAnims.forEach(a => { try{ a.cancel(); }catch(e){} });
  return _endFightIT.apply(this, arguments);
};

const _startFightIT = startFight;
startFight = function(){
  if(!sel.char || !sel.enemy) return;
  const isIT = !!A.enemies[sel.enemy].it;
  const r = _startFightIT.apply(this, arguments);
  if(!E) return r;
  E.itBarrageOk = false; E.itDashAt = 0; E.itAnims = [];
  const ew = $('#eWrap'), fe = $('#fE');
  if(isIT){
    ew.style.right = '-9vw';
    ew.style.bottom = '10%';
    ew.style.width = 'min(72vw,640px)';
    fe.style.maxHeight = '78vh';
    /* своя музыка на уже разбуженном плеере пвп */
    pvpAudio.src = IT_THEME;
    pvpAudio.loop = true;
    pvpAudio.volume = 0.8;
    pvpAudio.play().catch(() => {});
  }
  return r;
};/* ===== МУЗЫКА: предзагрузка целиком + один надёжный канал ===== */
function musMsg(t){
  const d = document.createElement('div');
  d.textContent = t;
  d.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#000;color:#fca5a5;border:1px solid #fff;padding:8px 12px;font:700 13px sans-serif;z-index:300;max-width:90vw;text-align:center';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 7000);
}
const MUS = {};
function musLoad(key, url){
  if(MUS[key]) return MUS[key].p;
  const o = MUS[key] = {};
  o.p = fetch(url).then(r => {
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.blob();
  }).then(b => {
    o.blob = b; o.url = URL.createObjectURL(b);
    return o;
  }).catch(e => {
    o.err = String(e);
    musMsg('Музыка ' + key + ' не загрузилась: ' + o.err);
    return o;
  });
  return o.p;
}
musLoad('it', IT_THEME);
musLoad('ts', TS_THEME);

/* отключаем все старые попытки музыки Титана */
tsMusicStart = function(){};
tsMusicGuard = function(){};
tsOn = false;
tsWant = false;
try{ tsStopWA(); }catch(e){}

/* музыка твоего Титана через Web Audio (играет вместе с пвп-музыкой) */
let tsBuf2 = null, tsSrc2 = null, tsG2 = null, tsWant2 = false;
function tsDecode(){
  return musLoad('ts', TS_THEME).then(o => {
    if(!o.blob || tsBuf2) return;
    return o.blob.arrayBuffer()
      .then(b => ctx().decodeAudioData(b))
      .then(buf => { tsBuf2 = buf; })
      .catch(e => musMsg('Титан: музыка не декодировалась: ' + e));
  });
}
function tsPlay2(){
  if(!tsWant2 || over || !tsBuf2 || tsSrc2) return;
  const c = ctx();
  if(c.state !== 'running') c.resume().catch(() => {});
  tsG2 = c.createGain(); tsG2.gain.value = 0.9;
  tsSrc2 = c.createBufferSource();
  tsSrc2.buffer = tsBuf2; tsSrc2.loop = true;
  tsSrc2.connect(tsG2).connect(c.destination);
  tsSrc2.start();
}
function tsStop2(){
  tsWant2 = false;
  if(tsSrc2){ try{ tsSrc2.stop(); }catch(e){} tsSrc2 = null; }
  if(tsG2){ try{ tsG2.disconnect(); }catch(e){} tsG2 = null; }
}
tsDecode();
setInterval(() => {
  if(!tsWant2 || over) return;
  const c = ctx();
  if(c.state !== 'running') c.resume().catch(() => {});
  if(tsBuf2 && !tsSrc2) tsPlay2();
}, 1000);

const _endFightMus = endFight;
endFight = function(){
  tsStop2();
  return _endFightMus.apply(this, arguments);
};

const _startFightMus = startFight;
startFight = function(){
  if(!sel.char || !sel.enemy) return;
  const isTS = sel.char === TS_KEY;
  const isIT = !!A.enemies[sel.enemy].it;
  tsStop2();
  const r = _startFightMus.apply(this, arguments);
  /* твой Титан */
  if(isTS){
    tsWant2 = true;
    if(tsBuf2) tsPlay2();
    else tsDecode().then(tsPlay2);
  }
  /* InfectedTitanSpeakerHare: заменяем пвп-музыку на его мелодию из памяти */
  if(isIT){
    const o = MUS.it || {};
    pvpAudio.onerror = () => musMsg('Мелодия Инфицированного не играет, код: ' + (pvpAudio.error ? pvpAudio.error.code : '?'));
    pvpAudio.src = o.url || IT_THEME;
    pvpAudio.loop = true;
    pvpAudio.volume = 0.8;
    const p = pvpAudio.play();
    if(p && p.catch) p.catch(e => musMsg('Мелодия Инфицированного заблокирована: ' + (e && e.name)));
  } else {
    pvpAudio.onerror = null;
  }
  return r;
};
